# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/
#
# License rules: this workspace is MIT OR Apache-2.0, and the firmware links
# everything below into one binary that people may redistribute. So every
# dependency must be permissive, or weak copyleft at file level for code that
# never reaches the binary. Strong copyleft (GPL, AGPL) and LGPL are not
# allowed: their terms do not fit a statically linked MIT OR Apache-2.0
# firmware.

[graph]
targets = []
all-features = false
no-default-features = false

# Advisories check for known security vulnerabilities
[advisories]
db-path = "~/.cargo/advisory-db"
ignore = []

# License compliance check
[licenses]
version = 2
confidence-threshold = 0.8
# The list holds exactly the licenses in use, so a new license in the tree is
# a decision someone makes, not something that slips in. A license that stops
# being used warns, so the list does not grow stale.
unused-allowed-license = "warn"

allow = [
    # Permissive licenses
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",               # Boost Software License (ryu)
    "Unicode-3.0",           # the Unicode data tables (icu, unicode-ident)
    "BlueOak-1.0.0",         # Blue Oak Model License (tinyrlibc, verhoeff)

    # Public domain
    "Unlicense",
    "0BSD",

    # Weak copyleft, file level. Only rs-matter's build-time code generator
    # uses it (nom-supreme and its helpers), so none of it reaches the
    # firmware binary.
    "MPL-2.0",
]

# tinyrlibc has no license field in its manifest, only a LICENCES.md with the
# Blue Oak Model License 1.0.0.
[[licenses.clarify]]
crate = "tinyrlibc"
expression = "BlueOak-1.0.0"
license-files = [{ path = "LICENCES.md", hash = 0x391e9384 }]

# The workspace crates are not published, so they need no license check
[licenses.private]
ignore = true
registries = []

# Bans check for denied crates or specific versions
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# Sources check for allowed registries
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# The unreleased dependency pins from the workspace `[patch]` and `fw`. See
# docs/building.md for why each one exists.
allow-git = [
    "https://github.com/project-chip/rs-matter",
    "https://github.com/esp-rs/openthread",
    "https://github.com/ivmarkov/esp-hal",
    "https://github.com/sysgrok/rs-matter-embassy",
]
