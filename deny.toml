# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/
#
# License rules:
# - Permissive and public domain licenses: ALLOWED
# - Copyleft licenses: NOT ALLOWED
# - Specific exceptions: EPL, MPL, LGPL (weak copyleft, unmodified use only)

[graph]
targets = []
all-features = false
no-default-features = false

# Advisories check for known security vulnerabilities
[advisories]
db-path = "~/.cargo/advisory-db"
ignore = []

# License compliance check
[licenses]
version = 2
confidence-threshold = 0.8
# Don't warn about licenses in allow list that aren't used by any crate
unused-allowed-license = "allow"

allow = [
    # Permissive licenses
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",               # Boost Software License
    "Unlicense",
    "CDLA-Permissive-2.0",   # Community Data License Agreement Permissive
    "BlueOak-1.0.0",         # Blue Oak Model License (used by tinyrlibc)

    # Public domain
    "CC0-1.0",
    "0BSD",

    # Weak copyleft - unmodified use and linking only
    "MPL-2.0",
    "LGPL-2.0-only",
    "LGPL-2.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",

    # Eclipse licenses - unmodified use only
    "EPL-1.0",
    "EPL-2.0",

    # Other
    "W3C",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]

# tinyrlibc has no license field in its manifest, only a LICENCES.md with the
# Blue Oak Model License 1.0.0.
[[licenses.clarify]]
crate = "tinyrlibc"
expression = "BlueOak-1.0.0"
license-files = [{ path = "LICENCES.md", hash = 0x391e9384 }]

# The workspace crates are not published, so they need no license check
[licenses.private]
ignore = true
registries = []

# Bans check for denied crates or specific versions
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# Sources check for allowed registries
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# The unreleased dependency pins from the workspace `[patch]` and `fw`. See
# docs/building.md for why each one exists.
allow-git = [
    "https://github.com/project-chip/rs-matter",
    "https://github.com/esp-rs/openthread",
    "https://github.com/ivmarkov/esp-hal",
    "https://github.com/sysgrok/rs-matter-embassy",
]
