[workspace]
resolver = "2"
members = ["core", "node", "fw", "sim"]
# `sim` is host-only, so a bare `cargo build` (which targets the bare-metal
# triple from `.cargo/config.toml`) must not reach it. `fw` is the firmware.
default-members = ["fw"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Workspace-wide lint configuration
[workspace.lints.rust]
missing_docs = "warn"
unused_imports = "warn"
warnings = { level = "deny" }

[workspace.lints.clippy]
# Enable pedantic lint group for additional code quality checks
pedantic = "warn"
# Documentation lints
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Disallow using expect
expect_used = "warn"
# Warn if unwrap is used
unwrap_used = "warn"
# Warn when .to_string() is used on &str (prefer .to_owned())
str_to_string = "warn"
# Enforce RFC 2126 module structure (module.rs instead of module/mod.rs)
mod_module_files = "warn"
# Prevent `use` and other items from appearing after statements in a block
items_after_statements = "warn"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
opt-level = "s"
overflow-checks = false

[profile.dev]
opt-level = "s"

[patch.crates-io]
# The ICD work - the `Icd` power mode state machine, the subscription keep-alive
# reporting, the `Send + Sync` rework the newer rs-matter-embassy builds on, and
# the MRP backoff accounting for an ICD sender's own polling interval (#638) -
# is past the published releases.
# `docs/building.md` has the whole pin set and why each one exists.
# `rs-matter-stack` is gone from the pin set: upstream absorbed it (#636), and
# the archived sysgrok repository's last revision only tracks a pre-`#634` main.
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "bf3fe6b94f6428d12611c67fcf698883c269507d" }

# The CSL API and the radio sleep path the SED driver needs, unreleased.
openthread = { git = "https://github.com/esp-rs/openthread", rev = "705c5576ccfd7b417cfa4b23912a13b1b99e01f2" }
openthread-sys = { git = "https://github.com/esp-rs/openthread", rev = "705c5576ccfd7b417cfa4b23912a13b1b99e01f2" }
# `Ieee802154::stop_receive` / `EspRadio::set_sleep`, so the SED receiver is off
# between data polls. Upstream's ESP radio still has a TODO to provide the
# `stop_receive` counterpart to `start_receive`, so this is the one genuine fork
# left in the set.
esp-hal = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-rtos = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-alloc = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-backtrace = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-println = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-radio = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-radio-rtos-driver = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-phy = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-sync = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-rom-sys = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-hal-procmacros = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-riscv-rt = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-bootloader-esp-idf = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
esp-metadata-generated = { git = "https://github.com/ivmarkov/esp-hal", rev = "6f81b6177dee8dd200df2e1cd0b94e10d8b9fc7f" }
