[package]
name = "xiao-soil-moisture-sensor-matter-thread"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "soil_sensor_core"
path = "src/lib.rs"

[[bin]]
name = "xiao-soil-moisture-sensor-matter-thread"
path = "src/main.rs"
harness = false

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
opt-level = "s"
overflow-checks = false

[profile.dev]
opt-level = "s"

[features]
default = ["esp32c6", "trouble", "thread"]
trouble = ["rs-matter-embassy/trouble"]
esp32c6 = [
  "esp-rtos/esp32c6",
  "esp-hal/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-println/esp32c6",
  "esp-radio/esp32c6",
  "esp-storage/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-metadata-generated/esp32c6",
  "portable-atomic/critical-section",
]
thread = [
  "rs-matter-embassy/openthread",
  "rs-matter-embassy/mbedtls",
  "rs-matter-embassy/openthread-heap-int-8192",
]

[dependencies]
log = "0.4"
embassy-executor = "0.10"
embassy-embedded-hal = "0.6"
embassy-futures = "0.1"
embassy-time = "0.5"
embassy-sync = "0.8"
esp-backtrace = { version = "0.20", features = ["panic-handler", "println"] }
esp-hal = { version = "~1.2", features = ["log-04", "unstable", "exception-handler"] }
esp-rtos = { version = "0.4", features = ["esp-radio", "embassy"] }
esp-alloc = "0.11"
esp-println = { version = "0.18", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["ble", "log-04", "unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["log-04"] }
esp-metadata-generated = "0.5"

# Pinned to our fork's `matter-sed-icd` branch: adaptive SED poll periods plus a
# hook that lets the app drive ICD Check-Ins (via the rs-matter-stack patch below).
rs-matter-embassy = { git = "https://github.com/jan-xyz/rs-matter-embassy", rev = "7d201d2962d09050467e8cfd6cc5011bf0ebd91d", default-features = false, features = [
  "esp",
  "log",
] }

sequential-storage = "3"
embedded-storage-async = "0.4.1"

tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }
static_cell = "2"
portable-atomic = "1"

[patch.crates-io]
# Pinned to our fork's `matter-sed-icd` branch. Exposes the interaction model's
# subscription table, which the app needs to send Matter ICD Check-In messages.
rs-matter-stack = { git = "https://github.com/jan-xyz/rs-matter-stack", rev = "c22e5b11ab08f8117178611152c7c2bf3b823a9d" }
# Local `sed-rx-sleep` worktrees of the esp-hal and openthread forks: they add
# `Ieee802154::stop_receive` and call it in `EspRadio::set_sleep`, so the SED
# receiver is off between data polls. Switch to `git` + `rev` once pushed.
openthread = { path = "/Users/jan.steinke/worktrees/openthread-sed-rx-sleep/openthread" }
esp-hal = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-hal" }
esp-rtos = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-rtos" }
esp-alloc = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-alloc" }
esp-backtrace = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-backtrace" }
esp-println = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-println" }
esp-radio = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-radio" }
esp-storage = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-storage" }
esp-bootloader-esp-idf = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-bootloader-esp-idf" }
esp-metadata-generated = { path = "/Users/jan.steinke/worktrees/esp-hal-sed-rx-sleep/esp-metadata-generated" }
