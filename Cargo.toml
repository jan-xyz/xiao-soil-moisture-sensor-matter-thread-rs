[workspace]
resolver = "2"
members = ["core", "node", "fw", "sim"]
# `sim` is host-only, so a bare `cargo build` (which targets the bare-metal
# triple from `.cargo/config.toml`) must not reach it. `fw` is the firmware.
default-members = ["fw"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
opt-level = "s"
overflow-checks = false

[profile.dev]
opt-level = "s"

[patch.crates-io]
# The ICD support `rs-matter-embassy`'s `icd` branch builds on (the `Icd` power
# mode state machine, `LitIcd`/`LitIcdMgmtHandler`) lives on `rs-matter`'s main
# branch, past the published `0.4.1` release that `rs-matter-stack` still
# resolves to.
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "4d4fd3a2d821fb0105a340e244b10be44efd3646" }
# `sysgrok/openthread`'s `csl` branch adds the CSL (Coordinated Sampled
# Listening) API (`set_csl_period`, `wait_radio_ready`, ...) and the `esp-radio`
# 1.0.0-beta.1 `Ieee802154` sleep support the SED driver needs.
openthread = { git = "https://github.com/sysgrok/openthread", rev = "41cfca398bb1d2d26deb6671e635ce262df4bfc9" }
openthread-sys = { git = "https://github.com/sysgrok/openthread", rev = "41cfca398bb1d2d26deb6671e635ce262df4bfc9" }
# `ivmarkov/esp-hal`'s `ieee802154-sleep` branch: the `esp-radio` 1.0.0-beta.1
# that `sysgrok/openthread` needs, plus `Ieee802154::stop_receive` /
# `EspRadio::set_sleep` so the SED receiver is off between data polls.
esp-hal = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-rtos = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-alloc = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-backtrace = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-println = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-radio = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-radio-rtos-driver = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-phy = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-sync = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-rom-sys = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-hal-procmacros = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-riscv-rt = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-storage = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-bootloader-esp-idf = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
esp-metadata-generated = { git = "https://github.com/ivmarkov/esp-hal", rev = "1926ae8dbe8c0ebd986568ff51b62eb1c7ce12c6" }
